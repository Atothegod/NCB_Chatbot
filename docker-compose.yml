services:
  db:
    image: postgres:17
    container_name: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file:
      - .env
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
    - db
      # db:
        # condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  chatbot:
    build:
      context: ./chatbot
      dockerfile: dockerfile
    env_file:
      - .env
    container_name: chatbot
    ports:
      - "8501:8501"
    volumes:
      - ./chatbot:/app
    depends_on:
      - backend
    command: chainlit run app.py --host 0.0.0.0 --port 8501

  ngrok:
    image: ngrok/ngrok:latest
    command: http chatbot:8501
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - chatbot


volumes:
  postgres_data: